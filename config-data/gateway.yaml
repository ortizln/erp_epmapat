server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://192.168.100.16:8761/eureka
  instance:
    hostname: 192.168.100.16

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
      - id: mc_recaudacion
        uri: http://192.168.100.16:8002
        predicates:
        - Path=/cajas/**
