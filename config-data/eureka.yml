spring:
  application:
    name: eureka
server:
  port: 8761

eureka:
  instance:
    hostname: eureka  # El nombre del servicio Eureka (crucial para Docker)
    prefer-ip-address: true
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://eureka:8761/eureka/  # El nombre del servicio Eureka