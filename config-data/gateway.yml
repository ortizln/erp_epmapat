server:
  port: 8000

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://eureka:8761/eureka


spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
      - id: mc_recaudacion
        uri: http://mc_recaudacion:8002
        predicates:
        - Path=/cajas/**
