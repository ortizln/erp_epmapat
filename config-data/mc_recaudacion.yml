server:
  port: 8002
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10 # Retry interval
    service-url:
      default-zone: http://192.168.100.16:8761/eureka
  instance:
    prefer-ip-address: true  # Asegura que se registre con la IP en vez del hostname
    instance-id: ${spring.application.name}:${server.port}
