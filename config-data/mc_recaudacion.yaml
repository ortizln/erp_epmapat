spring:
  cloud:
    loadbalancer:
      ribbon:
        enabled: true

server:
  port: ${PORT:${SERVER_PORT:0}}
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    hostname: mc_recaudacion
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}