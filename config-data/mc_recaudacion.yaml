server:
  port: ${PORT:${SERVER_PORT:0}}

spring:
  application:
    name: mc_recaudacion

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true # Usa la IP del host en lugar del nombre de host para evitar problemas de resolución
    hostname: localhost # Define un valor predeterminado para el nombre del host
