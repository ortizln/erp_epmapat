services:
  config-service:
    build: config-service
    image: config-service
    container_name: config-service
    ports:
      - 8081:8081
    restart: always
    networks:
      - epmapat-network
  eureka:
    build: eureka
    image: eureka:latest
    container_name: eureka
    ports:
      - 8761:8761
    restart: always
    networks:
      - epmapat-network
  gateway:
    build: gateway
    image: gateway:latest
    container_name: gateway
    ports:
      - 8082:8082
    restart: always
    networks:
      - epmapat-network
  mc_recaudacion:
    build: mc_recaudacion
    image: mc_recaudacion
    container_name: mc_recaudacion
    ports:
      - 8002:8002
    restart: always
    networks:
      - epmapat-network
networks:
  epmapat-network:
    driver: bridge