version: "3.9"

services:
  config-service:
    build: config-service
    image: config-service
    container_name: config-service
    ports:
      - "8081:8081"
    restart: always
    networks:
      - epmapat-network

  eureka:
    build: eureka
    image: eureka:latest
    container_name: eureka
    ports:
      - "8761:8761"
    restart: always
    networks:
      - epmapat-network
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: gateway
    image: gateway:latest
    container_name: gateway
    ports:
      - "8082:8082"
    restart: always
    networks:
      - epmapat-network
    depends_on:
      - eureka
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka

  mc_recaudacion:
    build: mc_recaudacion
    image: mc_recaudacion:latest
    container_name: mc_recaudacion
    ports:
      - "8002:8002"
    restart: always
    networks:
      - epmapat-network
    depends_on:
      - eureka
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      DB: jdbc:postgresql://postgres:5432/ErpEpmapaT
      USERNAME: postgres
      PASS: 086411421

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_DB: ErpEpmapaT
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 086411421
    ports:
      - "5432:5432"
    networks:
      - epmapat-network

networks:
  epmapat-network:
    driver: bridge